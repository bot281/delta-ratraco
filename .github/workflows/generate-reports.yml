name: 🚀 Sinh báo cáo tự động

on:
  # Chạy 8h sáng mỗi ngày (UTC+7 = 1h UTC)
  schedule:
    - cron: '0 1 * * *'

  # Chạy thủ công từ GitHub UI
  workflow_dispatch:
    inputs:
      script:
        description: 'Script cụ thể (all / bao_cao / thong_ke / check_debit)'
        required: false
        default: 'all'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cài đặt thư viện
        run: pip install -r scripts/requirements.txt

      - name: Tạo file service account
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > scripts/service-account.json

      - name: Chạy tất cả báo cáo
        if: ${{ github.event.inputs.script == 'all' || github.event_name == 'schedule' }}
        working-directory: scripts
        run: |
          echo "⏰ Bắt đầu: $(date '+%Y-%m-%d %H:%M:%S')"
          python check_debit.py
          python thong_ke.py
          python bao_cao.py
          echo "✅ Hoàn thành: $(date '+%Y-%m-%d %H:%M:%S')"

      - name: Chạy script cụ thể
        if: ${{ github.event.inputs.script != 'all' && github.event_name == 'workflow_dispatch' }}
        working-directory: scripts
        run: |
          python ${{ github.event.inputs.script }}.py

      - name: Thông báo lỗi (nếu có)
        if: failure()
        run: |
          echo "❌ Báo cáo thất bại lúc $(date '+%Y-%m-%d %H:%M:%S')"
          echo "Kiểm tra logs tại: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
