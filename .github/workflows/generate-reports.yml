name: Sinh bao cao tu dong

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      script:
        description: 'Script: all / bao_cao / thong_ke / check_debit'
        required: false
        default: 'all'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r scripts/requirements.txt
      - run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > scripts/service-account.json
      - name: Run reports
        working-directory: scripts
        run: |
          SCRIPT="${{ github.event.inputs.script }}"
          if [ "$SCRIPT" = "all" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            python check_debit.py && python thong_ke.py && python bao_cao.py
          else
            python "$SCRIPT.py"
          fi
